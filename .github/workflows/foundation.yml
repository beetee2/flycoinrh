name: FLYTRAP foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Use bundled SQLite instead of the runner's older system library.
      UV_MANAGED_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - run: npm install --global npm@12.0.2
      - run: make bootstrap
      - run: cd web && npx --no-install playwright install --with-deps chromium
      - run: make verify test-upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-evidence
          path: artifacts/milestones/01/
          if-no-files-found: error
