[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "flytrap"
version = "0.1.0"
description = "Wallet-free connectome challenge foundation"
requires-python = "==3.14.7"
dependencies = [
  "fastapi==0.128.0",
  "pydantic==2.13.5",
  "Pillow==12.2.0",
  "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
model = [
  "numpy==2.4.2", "scipy==1.17.1", "pandas==3.0.1",
  "pyarrow==23.0.1",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10", "pytest-cov>=7,<8", "pytest-timeout>=2,<3",
  "hypothesis>=6,<7", "httpx==0.28.1", "jsonschema>=4,<5", "ruff>=0.15,<1",
  "numpy==2.4.2", "scipy==1.17.1",
]
upstream = [
  "requests==2.32.5", "eth-account==0.13.7", "eth-utils==5.3.1",
  "eth-abi==6.0.0", "playwright==1.62.0",
]

[project.scripts]
flytrap = "flytrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["flytrap"]

[tool.hatch.build.targets.wheel.force-include]
"flysim.py" = "flysim.py"
"flyeye.py" = "flyeye.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 30
markers = [
  "unit: isolated foundation behavior",
  "property: generated invariant checks",
  "contract: Python and JSON schema contracts",
  "db: real file-backed SQLite lifecycle",
  "api: HTTP and lifespan",
  "worker: actual subprocess and serialized fixture boundary",
  "real_model: requires actual connectome data and implemented model adapter",
]

[tool.ruff]
target-version = "py314"
line-length = 110
include = ["flytrap/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
